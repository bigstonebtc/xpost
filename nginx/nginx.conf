events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name _;

        location / {
            return 301 /xpost/;
        }

        location /xpost/api/ {
            proxy_pass http://backend:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /xpost/ {
            proxy_pass http://frontend:80/;
            proxy_set_header Host $host;
        }
    }
}
