services:
  db:
    image: postgres:16-alpine
    restart: always
    env_file: ./conf/env.conf
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: always
    env_file: ./conf/env.conf
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro
      - ./tweetsource:/app/tweetsource:ro
      - ./conf/env.conf:/app/conf/env.conf
      - ./prompts:/app/prompts
      - ./documents:/app/documents:ro

  frontend:
    build: ./frontend
    restart: always

  nginx:
    build: ./nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro

volumes:
  postgres_data:
