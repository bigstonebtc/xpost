services:
  tor:
    build: ./tor
    restart: always
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9050"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: always
    depends_on:
      tor:
        condition: service_healthy
    volumes:
      # 各ユーザーの設定・DB・プロンプト・資料・ログは /home/<user>/xpost/ 以下にあり、
      # backendは単一プロセスで全ユーザー分をこのマウント経由で読み書きする
      # （共有プログラムモード。詳細はdocs/multi_user_design.md参照）。
      - /home:/home
      # Tor Serviceの[Restart]機能（POST /tor/restart）用。
      # backendにホストのDockerデーモン制御権を与えるため取り扱いに注意。
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    build: ./frontend
    restart: always

  nginx:
    build: ./nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
